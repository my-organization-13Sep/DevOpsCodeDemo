name: Build and publish addressbook

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      # Fetch the application source, tests, and dockerfile.
      - name: Checkout repository
        uses: actions/checkout@v7

      # Install Temurin 17 and cache dependencies for the runner's Maven.
      - name: Set up Java and Maven cache
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Run unit tests and package target/addressbook.war.
      - name: Build Java WAR
        run: |
          mvn clean package
          test -f target/addressbook.war

      # Initialize the BuildKit builder used to build the image.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Authenticate using repository secrets; never hardcode credentials.
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Use the local context so the Maven-generated WAR is included.
      # v7 replaces v5's deprecated Node 20 runtime.
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/addressbook:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/addressbook:${{ github.sha }}
