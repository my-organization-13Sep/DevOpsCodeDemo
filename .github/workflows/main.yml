name: Build and Deploy java code 
on: push  
jobs:
    cicd-job:
        runs-on: ubuntu-latest
        steps:
            - name: Install JAVA and Maven
              uses: actions/setup-java@v5
              with:
                distribution: 'temurin'
                java-version: '21'
            - name: Install DOCKER  
              uses: docker/setup-buildx-action@v4
            - name: Checkout code
              uses: actions/checkout@v7
            - name: Build the code and generate artifact 
              run: mvn package
            - name: Build the docker Image using dockerfile  
              run: docker build -t my-java-app .
            - name: Run a command to check image creation
              run: docker images
